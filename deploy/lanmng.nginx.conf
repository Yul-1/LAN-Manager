# LANMng — vhost per l'nginx DELL'HOST (NON il container).
# Installare in /etc/nginx/sites-available/lanmng.conf e linkare in sites-enabled.
#
# Da usare quando le porte 80/443 dell'host sono gia' servite da altri vhost:
# LANMng risponde in HTTPS su :443 con un nome suo (server_name), accanto agli
# altri. :80 (per quel nome) e :81 (il vecchio indirizzo in chiaro) rimandano
# all'HTTPS. Tutto e' LAN-only.
# Accesso: https://<nome-di-lanmng>/
#
# Prima di installarlo:
#   - sostituire lanmng.example.lan con il nome vero (compare piu' volte);
#   - il nome deve risolvere sull'host (DNS locale) ed essere fra i SAN del
#     certificato;
#   - creare /etc/nginx/snippets/lanmng-tls.conf con ssl_certificate,
#     ssl_certificate_key e i protocolli ammessi. Se l'host ha gia' uno snippet
#     TLS per gli altri vhost basta un link simbolico a quello.
#
# Il frontend statico va copiato in /var/www/lanmng (SPA: fallback su index.html).
# Il backend (uvicorn) non ha porte: ascolta sul unix socket /run/lanmng/backend.sock,
# in una cartella che raggiungono solo il container (uid 1000) e il gruppo www-data.
# La cartella la crea systemd-tmpfiles a ogni boot: deploy/lanmng.tmpfiles.conf va
# installato in /etc/tmpfiles.d/lanmng.conf (vedi README, deploy su nginx host).

upstream lanmng_backend {
    server unix:/run/lanmng/backend.sock;
}

# :81 era l'indirizzo in chiaro fino alla 0.9.x: resta solo per non rompere i
# segnalibri. Rimanda sempre al nome, anche se si arriva per IP, perche' il
# certificato e il cookie di sessione valgono per quello.
server {
    listen 81;
    listen [::]:81;
    server_name lanmng.example.lan;   # unico vhost su :81: risponde anche per IP
    server_tokens off;
    return 301 https://lanmng.example.lan$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lanmng.example.lan;
    server_tokens off;
    return 301 https://lanmng.example.lan$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanmng.example.lan;

    include /etc/nginx/snippets/lanmng-tls.conf;

    # Niente versione di nginx nelle risposte e nelle pagine d'errore.
    server_tokens off;

    # Allineato agli altri vhost del server.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin: aprendo il pannello di un dispositivo (link "↗", target=_blank)
    # l'indirizzo della dashboard non viaggia verso destinazioni esterne.
    add_header Referrer-Policy "same-origin" always;
    # CSP: la SPA usa solo asset locali; consentiti stili inline (attributi style)
    # e WebSocket/fetch same-origin. Secondo livello di difesa contro XSS.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # La dashboard non usa nessuna di queste API del browser: negarle riduce
    # cio' che un eventuale script iniettato potrebbe chiedere all'utente.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=()" always;
    # Senza questo header il browser applica la cache euristica: Firefox teneva
    # app.js per giorni senza nemmeno rivalidarlo, mostrando una UI vecchia dopo
    # un deploy. "no-cache" non disabilita la cache, obbliga a rivalidare: sulla
    # LAN costa un 304 e garantisce che si veda sempre la versione installata.
    # Nota: gli add_header dentro un location azzerano quelli del server, per
    # questo stanno tutti qui a livello di server.
    add_header Cache-Control "no-cache" always;

    # Frontend statico (SPA): fallback su index.html per le route lato client.
    root /var/www/lanmng;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket update live: richiede l'upgrade della connessione.
    location /ws {
        proxy_pass http://lanmng_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr e non $proxy_add_x_forwarded_for: il backend (uvicorn su
        # unix socket, --forwarded-allow-ips "*") prende la voce piu' a sinistra,
        # e accodando a quella mandata dal client l'IP lo sceglierebbe lui.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Dice al backend se il client e' in HTTPS: da li' dipende il flag
        # Secure del cookie di sessione (routers/auth.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        # Il WS resta aperto: niente timeout aggressivi.
        proxy_read_timeout 3600s;
    }

    # API REST.
    location /api/ {
        proxy_pass http://lanmng_backend;
        # $http_host (non $host) conserva l'eventuale porta: i redirect 307 che
        # FastAPI genera per i path senza slash finale altrimenti la perdono.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr e non $proxy_add_x_forwarded_for: il backend (uvicorn su
        # unix socket, --forwarded-allow-ips "*") prende la voce piu' a sinistra,
        # e accodando a quella mandata dal client l'IP lo sceglierebbe lui.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Dice al backend se il client e' in HTTPS: da li' dipende il flag
        # Secure del cookie di sessione (routers/auth.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        # Alcune chiamate sono lente per natura: nmap dai tool di rete ha 180s
        # di budget (services/nettools.py), come lo scan dei dispositivi e la
        # raccolta risorse via SSH. Il default di 60s le troncava con un 504 in
        # HTML, che il frontend non poteva nemmeno interpretare. Sta sopra al
        # budget massimo del client, cosi' a scrivere il messaggio d'errore e'
        # LANMng e non una pagina del proxy.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        # I tool di rete mandano l'output mentre il comando gira (NDJSON su
        # /api/tools/stream). Non serve spegnere `proxy_buffering` per tutta la
        # location: quella risposta porta `X-Accel-Buffering: no`, che nginx
        # rispetta caso per caso. Senza, il proxy accumulerebbe il corpo e lo
        # consegnerebbe tutto alla fine: lo streaming sarebbe solo apparente.
    }

    # Healthcheck.
    location = /health {
        proxy_pass http://lanmng_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
