# LANMng — cartella del socket del backend sull'host (scenario nginx host).
# Installare in /etc/tmpfiles.d/lanmng.conf, poi: sudo systemd-tmpfiles --create
#
# /run e' un tmpfs e si svuota a ogni avvio: la ricrea systemd-tmpfiles al boot.
# 0750 1000:www-data = entrano solo l'utente del container (appuser, uid 1000)
# e nginx (gruppo www-data). Il socket dentro e' 0666 per scelta di uvicorn:
# a decidere chi si collega e' questa cartella. Se l'nginx dell'host gira con
# un altro gruppo (es. "nginx" su Fedora/Arch), cambialo qui.
d /run/lanmng 0750 1000 www-data -
