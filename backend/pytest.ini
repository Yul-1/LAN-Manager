[pytest]
# rootdir = backend/ perche' il progetto usa import piatti ("from config import
# settings", "from services.x import y"): pythonpath la aggiunge a sys.path e i
# test importano gli stessi nomi che usa il codice in produzione.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: usa TestClient sull'app reale con i connettori sostituiti da fake
